name: CI

# Runs on every push and pull request to main. Fast, deterministic, free.
#
# Deliberately scoped to LINT + UNIT TESTS. The LLM eval (tests/run_eval.py) is
# NOT run here on purpose: it calls the Anthropic API (costs money), needs live
# secrets + a populated Pinecone index, and is non-deterministic — all of which
# make it a poor fit for a per-push gate. Run it manually or on a schedule.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # Installing requirements.txt also proves it's installable from scratch —
        # the check that would have caught the missing beautifulsoup4/httpx.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run unit tests
        # Whole directory, not a named file, so new test modules are picked up
        # automatically instead of silently never running. run_eval.py is not
        # collected despite living here: pytest only gathers files matching
        # test_*.py, which is what keeps the paid eval out of this job.
        run: pytest tests/ -v
